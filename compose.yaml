services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes: ["seismic-data:/app/runtime"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    volumes: ["seismic-data:/app/runtime"]
    restart: unless-stopped
    depends_on: [api]
  collector:
    build: .
    command: ["python", "-m", "backend.collector", "--mode", "fdsn"]
    env_file: .env
    volumes: ["seismic-data:/app/runtime"]
    restart: unless-stopped
    depends_on: [api]
volumes:
  seismic-data:
